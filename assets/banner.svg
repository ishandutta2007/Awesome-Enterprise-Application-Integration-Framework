<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Glowing Orbs Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1" />
    </pattern>

    <!-- Dynamic Pulsing Styles -->
    <style>
      .pulse-slow {
        animation: pulseSlow 8s ease-in-out infinite alternate;
      }
      .pulse-fast {
        animation: pulseFast 4s ease-in-out infinite alternate;
      }
      .flow-path {
        stroke-dasharray: 8 16;
        animation: flowDash 25s linear infinite;
      }
      .flow-path-reverse {
        stroke-dasharray: 6 12;
        animation: flowDashRev 20s linear infinite;
      }
      .node-pulse {
        animation: nodePing 3s ease-in-out infinite alternate;
      }
      .badge-glow {
        animation: badgePulse 5s ease-in-out infinite alternate;
      }

      @keyframes pulseSlow {
        0% { transform: scale(1) translate(0, 0); opacity: 0.25; }
        100% { transform: scale(1.15) translate(20px, -15px); opacity: 0.45; }
      }
      @keyframes pulseFast {
        0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
        100% { transform: scale(1.2) translate(-25px, 20px); opacity: 0.55; }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes flowDashRev {
        to { stroke-dashoffset: 1000; }
      }
      @keyframes nodePing {
        0% { r: 5; opacity: 0.6; }
        100% { r: 8; opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
      }
      @keyframes badgePulse {
        0% { opacity: 0.85; }
        100% { opacity: 1; filter: drop-shadow(0 0 10px rgba(129, 140, 248, 0.4)); }
      }
    </style>
  </defs>

  <!-- Deep Tech Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Elements -->
  <g>
    <circle cx="180" cy="120" r="160" fill="#38bdf8" filter="url(#glow)" class="pulse-slow" />
    <circle cx="1020" cy="280" r="180" fill="#818cf8" filter="url(#glow)" class="pulse-fast" />
    <circle cx="600" cy="380" r="140" fill="#c084fc" filter="url(#glow)" class="pulse-slow" />
  </g>

  <!-- High-Tech Background Grid -->
  <rect width="1200" height="420" fill="url(#cyberGrid)" />

  <!-- Dynamic Animated Integration Pipeline / EIP Architecture Circuit Lines (Background) -->
  <g opacity="0.45">
    <!-- Pipeline 1: Top Flow -->
    <path class="flow-path" d="M 0 100 Q 300 40 600 100 T 1200 80" fill="none" stroke="#38bdf8" stroke-width="2" />
    <!-- Pipeline 2: Central Connecting Stream -->
    <path class="flow-path-reverse" d="M 0 340 C 350 390 850 290 1200 350" fill="none" stroke="#818cf8" stroke-width="2.5" />
    <!-- Pipeline 3: Cross Hub Connectors -->
    <path class="flow-path" d="M 120 420 L 320 280 L 880 280 L 1080 0" fill="none" stroke="#c084fc" stroke-width="1.5" />
    
    <!-- Integration Pipeline Nodes (Subtle Animated EIP Hubs) -->
    <circle cx="320" cy="280" r="6" fill="#38bdf8" class="node-pulse" />
    <circle cx="600" cy="100" r="6" fill="#818cf8" class="node-pulse" style="animation-delay: 1s;" />
    <circle cx="880" cy="280" r="6" fill="#c084fc" class="node-pulse" style="animation-delay: 2s;" />
    <circle cx="980" cy="85" r="5" fill="#38bdf8" class="node-pulse" style="animation-delay: 1.5s;" />
    <circle cx="210" cy="75" r="5" fill="#c084fc" class="node-pulse" style="animation-delay: 0.5s;" />
  </g>

  <!-- Ambient Border / Glass Outline -->
  <rect x="15" y="15" width="1170" height="390" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Foreground Content Container (Guaranteed Crisp Foreground Legibility) -->
  <g>
    <!-- Top Super-Badge Pill -->
    <g class="badge-glow" transform="translate(425, 42)">
      <rect width="350" height="34" rx="17" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.2" />
      <circle cx="20" cy="17" r="5" fill="#38bdf8" />
      <text x="35" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="1.5">ENTERPRISE INTEGRATION PATTERNS &amp; iPAAS</text>
    </g>

    <!-- Main Title in Forefront -->
    <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.8">
      Awesome Enterprise Application Integration
    </text>

    <!-- Subtitle with Glowing Accent Gradient -->
    <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="url(#accentGrad)" letter-spacing="0.2">
      Curated Ecosystem of Modern iPaaS Platforms &amp; Open-Source EIP Runtimes
    </text>

    <!-- Concise Meta Description in Foreground -->
    <text x="600" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.1">
      Connect ERPs, CRMs, Databases, AI Agents &amp; APIs with battle-tested patterns and transparent pricing
    </text>

    <!-- Ecosystem Feature Pills (Foreground Cards) -->
    <g transform="translate(180, 280)">
      <!-- Pill 1: EIP Frameworks -->
      <g transform="translate(0, 0)">
        <rect width="185" height="52" rx="10" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.2" />
        <text x="92" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="0.8">EIP FRAMEWORKS</text>
        <text x="92" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#f1f5f9">Camel • Spring • Rust</text>
      </g>

      <!-- Pill 2: Enterprise iPaaS -->
      <g transform="translate(210, 0)">
        <rect width="185" height="52" rx="10" fill="url(#cardGrad)" stroke="rgba(129, 140, 248, 0.25)" stroke-width="1.2" />
        <text x="92" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#818cf8" letter-spacing="0.8">ENTERPRISE iPAAS</text>
        <text x="92" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#f1f5f9">MuleSoft • Boomi • SAP</text>
      </g>

      <!-- Pill 3: Workflow Automation -->
      <g transform="translate(420, 0)">
        <rect width="200" height="52" rx="10" fill="url(#cardGrad)" stroke="rgba(192, 132, 252, 0.25)" stroke-width="1.2" />
        <text x="100" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#c084fc" letter-spacing="0.8">WORKFLOW AUTOMATION</text>
        <text x="100" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#f1f5f9">n8n • Dapr • Node-RED</text>
      </g>

      <!-- Pill 4: Data Pipelines -->
      <g transform="translate(645, 0)">
        <rect width="195" height="52" rx="10" fill="url(#cardGrad)" stroke="rgba(45, 212, 191, 0.25)" stroke-width="1.2" />
        <text x="97" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#2dd4bf" letter-spacing="0.8">STREAMING &amp; PIPELINES</text>
        <text x="97" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#f1f5f9">Kafka • NiFi • Airbyte</text>
      </g>
    </g>

    <!-- Bottom Footer Trust Metrics -->
    <text x="600" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b" letter-spacing="1">
      100% COMMUNITY CURATED • ARCHITECT TESTED • TRANSPARENT PRICING &amp; FREE TIERS
    </text>
  </g>
</svg>
